<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>crafter</title>
    <style>
      /*
       * Maple Mono, bundled with the demo so the terminal renders the same
       * everywhere (SIL OFL 1.1 - see fonts/LICENSE.txt).
       */
      @font-face {
        font-family: 'Maple Mono';
        src: url('./fonts/MapleMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'Maple Mono';
        src: url('./fonts/MapleMono-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: 'Maple Mono';
        src: url('./fonts/MapleMono-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }

      @font-face {
        font-family: 'Maple Mono';
        src: url('./fonts/MapleMono-BoldItalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /*
       * Page scrollbar: the native one is hidden and replaced by a thin
       * indicator that only fades in while scrolling (see the script below).
       */
      html {
        scrollbar-width: none; /* Firefox */
      }

      html::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Edge */
      }

      .page-scrollbar {
        position: fixed;
        top: 0;
        right: 3px;
        width: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.16);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 10;
      }

      .page-scrollbar.visible {
        opacity: 1;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .terminal-window {
        width: 100%;
        max-width: 1000px;
        background: #1e1e1e;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .title-bar {
        background: #2d2d2d;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #1a1a1a;
      }

      .traffic-lights {
        display: flex;
        gap: 8px;
      }

      .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .light.red {
        background: #ff5f56;
      }

      .light.yellow {
        background: #ffbd2e;
      }

      .light.green {
        background: #27c93f;
      }

      .title {
        color: #e5e5e5;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .connection-status {
        margin-left: auto;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .connection-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #666;
      }

      .connection-dot.connected {
        background: #27c93f;
      }

      #terminal-container {
        height: 600px;
        padding: 16px;
        background: #1e1e1e;
        position: relative;
        overflow: hidden;
      }

      /* Ensure terminal canvas can handle scrolling */
      #terminal-container canvas {
        display: block;
      }

      @media (max-width: 768px) {
        body {
          padding: 20px 10px;
        }

        #terminal-container {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="terminal-window">
      <div class="title-bar">
        <div class="traffic-lights">
          <span class="light red"></span>
          <span class="light yellow"></span>
          <span class="light green"></span>
        </div>
        <div class="title">crafter</div>
        <div class="connection-status">
          <span class="connection-dot" id="connection-dot" title="Disconnected"></span>
        </div>
      </div>
      <div id="terminal-container"></div>
    </div>
    <div class="page-scrollbar" id="page-scrollbar"></div>

    <script type="module">
      import {
        init,
        Terminal,
        isFontAvailable,
        parseGhosttyConfig,
        mergeGhosttyConfigs,
        toTerminalOptions,
      } from '../lib/index.ts';
      import { FitAddon } from '../lib/addons/fit.ts';

      // Maple Mono, bundled with the demo (see demo/fonts, SIL OFL 1.1) so the
      // glyphs and cell metrics don't depend on what is installed locally.
      const BUNDLED_FONT_FAMILY = 'Maple Mono';

      let term;
      let ws;
      let fitAddon;

      /**
       * Metrics read from the bundled font's own tables
       * (fonts/MapleMono-metrics.json, generated by
       * scripts/build-font-metrics.py). Passing them makes the grid identical
       * on every browser and platform instead of depending on the platform
       * font backend. The renderer ignores them if another font ends up being
       * used.
       */
      async function loadBundledFontMetrics() {
        try {
          const response = await fetch('./fonts/MapleMono-metrics.json');
          if (!response.ok) return undefined;
          return await response.json();
        } catch (error) {
          console.warn('crafter-terminal: could not load the bundled font metrics', error);
          return undefined;
        }
      }

      /**
       * Load the demo's bundled config and, when present, the user's local
       * Ghostty config on top of it. Served by the demo server (see
       * demo/bin/demo.js); when it isn't reachable we keep the library
       * defaults, which are Ghostty's.
       */
      async function loadGhosttyOptions() {
        try {
          const response = await fetch('/ghostty-config.json');
          if (!response.ok) return {};
          const payload = await response.json();
          if (!payload.available) {
            console.info('crafter-terminal: no Ghostty config found, using Ghostty defaults');
            return {};
          }

          const bundled = payload.bundledConfigText
            ? parseGhosttyConfig(payload.bundledConfigText)
            : null;
          const local = payload.localConfigText
            ? parseGhosttyConfig(payload.localConfigText)
            : null;

          let config;
          if (bundled && local) {
            config = mergeGhosttyConfigs([bundled, local]);
            // A local config that sets font-family replaces the bundled one
            // (accumulating would make the bundled font win over the user's).
            if (local.fontFamily.length > 0) config.fontFamily = [...local.fontFamily];
          } else {
            config = bundled ?? local;
          }
          if (!config) return {};

          // The bundled webfont is always available, so keep it as a fallback
          // behind whatever the user configured.
          if (!config.fontFamily.includes(BUNDLED_FONT_FAMILY)) {
            config.fontFamily.push(BUNDLED_FONT_FAMILY);
          }

          const { options, warnings } = toTerminalOptions(config, { themeText: payload.themeText });
          for (const warning of warnings) console.warn('crafter-terminal:', warning);
          console.info(
            'crafter-terminal: using',
            local ? 'your Ghostty config (on top of the bundled defaults)' : 'the bundled config',
            payload.themeName ? `(theme: ${payload.themeName})` : ''
          );

          // The renderer falls back to the default monospace stack when the
          // configured font is missing; tell the user why the glyphs differ.
          const primary = local?.fontFamily[0];
          if (primary && isFontAvailable(primary, config.fontSize ?? 14) === false) {
            console.warn(
              `crafter-terminal: font "${primary}" is not installed for this browser; ` +
                `rendering with the bundled "${BUNDLED_FONT_FAMILY}" instead`
            );
          }

          return { options, padding: config.windowPaddingX, paddingY: config.windowPaddingY };
        } catch (error) {
          console.warn('crafter-terminal: could not load Ghostty config', error);
          return {};
        }
      }

      /** Wait for the bundled webfont so metrics are measured with it. */
      async function loadBundledFonts() {
        if (!document.fonts) return;
        try {
          await Promise.all([
            document.fonts.load(`400 14px "${BUNDLED_FONT_FAMILY}"`),
            document.fonts.load(`700 14px "${BUNDLED_FONT_FAMILY}"`),
            document.fonts.load(`italic 400 14px "${BUNDLED_FONT_FAMILY}"`),
            document.fonts.load(`italic 700 14px "${BUNDLED_FONT_FAMILY}"`),
          ]);
        } catch (error) {
          console.warn('crafter-terminal: could not load the bundled font', error);
        }
      }

      async function initTerminal() {
        // Initialize WASM
        await init();

        // Fonts must be loaded before the renderer measures cell metrics
        await loadBundledFonts();

        // Bundled defaults, plus the local Ghostty config when available
        const ghostty = await loadGhosttyOptions();
        const fontMetrics = await loadBundledFontMetrics();

        term = new Terminal({
          cursorBlink: true,
          ...ghostty.options,
          // Only applies when the bundled font is the one in use
          fontMetrics,
        });

        fitAddon = new FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        if (ghostty.padding && ghostty.paddingY) {
          container.style.padding = `${ghostty.paddingY.topLeft}px ${ghostty.padding.topLeft}px`;
        }

        term.open(container);
        fitAddon.fit();
        fitAddon.observeResize(); // Auto-fit when container resizes

        // Handle window resize (for browsers that don't trigger ResizeObserver on window resize)
        window.addEventListener('resize', () => {
          fitAddon.fit();
        });

        // Handle terminal resize
        term.onResize((size) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            // Send resize as control sequence (server expects this format)
            ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
          }
        });

        // Handle user input
        term.onData((data) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(data);
          }
        });

        // Debug scrollback
        console.log('Terminal scrollback:', term.buffer?.scrollback?.length || 'N/A');
        term.onScroll((ydisp) => {
          console.log('Scroll position:', ydisp);
        });

        // Connect to PTY server - terminal is ready immediately after open()
        console.log('[Demo] Terminal ready, connecting with size:', term.cols, 'x', term.rows);
        connectWebSocket();
      }

      async function fetchAuthToken() {
        const response = await fetch('/api/token', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Token request failed with HTTP ${response.status}`);
        }

        const body = await response.json();
        if (!body || typeof body.token !== 'string' || body.token.length === 0) {
          throw new Error('Token response did not include a token');
        }

        return body.token;
      }

      function buildWebSocketUrl(token) {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const params = new URLSearchParams();
        params.set('cols', String(term.cols));
        params.set('rows', String(term.rows));
        params.set('token', token);
        return `${protocol}//${window.location.host}/ws?${params.toString()}`;
      }

      async function connectWebSocket() {
        updateConnectionStatus(false, 'Authenticating...');

        let token;
        try {
          token = await fetchAuthToken();
        } catch (error) {
          console.error('Authentication failed:', error);
          updateConnectionStatus(false, 'Auth error');
          setTimeout(connectWebSocket, 3000);
          return;
        }

        updateConnectionStatus(false, 'Connecting...');
        ws = new WebSocket(buildWebSocketUrl(token));

        ws.onopen = () => {
          console.log('WebSocket connected');
          updateConnectionStatus(true);
        };

        ws.onmessage = (event) => {
          // Server sends raw strings, not JSON
          term.write(event.data);
        };

        ws.onerror = (error) => {
          console.error('WebSocket error:', error);
          updateConnectionStatus(false, 'Error');
        };

        ws.onclose = () => {
          console.log('WebSocket disconnected');
          updateConnectionStatus(false);

          // Attempt to reconnect after 3 seconds
          setTimeout(() => {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
              connectWebSocket();
            }
          }, 3000);
        };
      }

      function updateConnectionStatus(connected, message) {
        const dot = document.getElementById('connection-dot');
        const label = message || (connected ? 'Connected' : 'Disconnected');

        dot.classList.toggle('connected', connected);
        // The status is only shown as the dot color, so keep the text as a tooltip
        dot.title = label;
        dot.setAttribute('aria-label', label);
      }

      /**
       * Thin page scrollbar that only shows up while scrolling.
       *
       * The native scrollbar is hidden in CSS (see the stylesheet); this
       * mirrors the scroll position with a faint bar that fades in on scroll
       * and out again shortly after.
       */
      function initPageScrollbar() {
        const bar = document.getElementById('page-scrollbar');
        const HIDE_DELAY_MS = 900;
        let hideTimer;

        const update = (show) => {
          const doc = document.documentElement;
          const scrollable = doc.scrollHeight - window.innerHeight;

          if (scrollable <= 1) {
            bar.classList.remove('visible');
            return;
          }

          const height = Math.max(32, (window.innerHeight / doc.scrollHeight) * window.innerHeight);
          const top = (window.scrollY / scrollable) * (window.innerHeight - height);
          bar.style.height = `${height}px`;
          bar.style.transform = `translateY(${top}px)`;

          if (!show) return;
          bar.classList.add('visible');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => bar.classList.remove('visible'), HIDE_DELAY_MS);
        };

        window.addEventListener('scroll', () => update(true), { passive: true });
        window.addEventListener('resize', () => update(false));
        // Position it without flashing it on load
        update(false);
      }

      // Initialize on load
      initPageScrollbar();
      initTerminal();
    </script>
  </body>
</html>
